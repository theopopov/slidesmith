<!doctype html><html><head><meta charset="utf-8"><style>
/*@BRAND_CSS@*/
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:var(--font-family-body)}
.board{width:1080px;height:1350px;position:relative;background:var(--color-bg-page);
  padding:var(--spacing-64);display:flex;flex-direction:column}
.kicker{font-size:var(--font-size-kicker);font-weight:var(--font-weight-bold);letter-spacing:.08em;
  text-transform:uppercase;color:var(--color-bg-accent)}
.h{font-family:var(--font-family-heading);font-weight:var(--font-weight-bold);
  font-size:var(--font-size-headline);line-height:1.04;margin-top:var(--spacing-24);
  color:var(--color-text-default)}
.spacer{flex:1}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:baseline;justify-content:space-between;
  padding:var(--spacing-32) 0;border-bottom:var(--border-width) solid var(--color-border-subtle)}
.row:last-child{border-bottom:none}
.stage{font-size:var(--font-size-subhead);font-weight:var(--font-weight-semibold);color:var(--color-text-muted)}
.val{font-family:var(--font-family-heading);font-weight:var(--font-weight-black);
  font-size:var(--font-size-display);line-height:.9;letter-spacing:-.03em;color:var(--color-text-default)}
.row.peak .stage{color:var(--color-text-default)}
.row.peak .val{color:var(--color-text-highlight)}
.footer{position:absolute;left:var(--spacing-64);right:var(--spacing-64);bottom:var(--spacing-40);
  display:flex;justify-content:space-between;font-size:var(--font-size-caption);
  font-weight:var(--font-weight-medium);color:var(--color-text-muted)}
</style></head><body>
<div class="board">
  <div class="kicker">PROGRESSION</div>
  <div class="h">The delta is the message.</div>
  <div class="spacer"></div>
  <div class="rows">
    <div class="row"><span class="stage">Week 1</span><span class="val">1</span></div>
    <div class="row"><span class="stage">Week 2</span><span class="val">3</span></div>
    <div class="row"><span class="stage">Week 3</span><span class="val">8</span></div>
    <div class="row peak"><span class="stage">Week 4</span><span class="val">21</span></div>
  </div>
  <div class="spacer"></div>
  <div class="footer"><span>@yourhandle · Your tagline here</span><span>PROGRESSION</span></div>
</div>
</body></html>
