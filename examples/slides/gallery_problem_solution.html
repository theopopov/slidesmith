<!doctype html><html><head><meta charset="utf-8"><style>
/*@BRAND_CSS@*/
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:var(--font-family-body)}
.board{width:1080px;height:1350px;position:relative;background:var(--color-bg-page);
  padding:var(--spacing-64);display:flex;flex-direction:column}
.kicker{font-size:var(--font-size-kicker);font-weight:var(--font-weight-bold);letter-spacing:.08em;
  text-transform:uppercase;color:var(--color-bg-accent)}
.spacer{flex:1}
.block{border-radius:var(--radius-card);padding:var(--spacing-48)}
.prob{background:var(--color-bg-surface);border:var(--border-width) solid var(--color-border-subtle)}
.lab{font-size:var(--font-size-kicker);font-weight:var(--font-weight-bold);letter-spacing:.06em;
  text-transform:uppercase}
.prob .lab{color:var(--color-status-down)}
.prob .txt{font-family:var(--font-family-heading);font-weight:var(--font-weight-semibold);
  font-size:var(--font-size-subhead);line-height:1.15;color:var(--color-text-default);margin-top:var(--spacing-16)}
.arrow{align-self:center;color:var(--color-text-highlight);font-size:48px;margin:var(--spacing-24) 0;line-height:0}
.sol{background:var(--color-bg-accent)}
.sol .lab{color:var(--color-text-on-accent);opacity:.75}
.sol .txt{font-family:var(--font-family-heading);font-weight:var(--font-weight-black);
  font-size:var(--font-size-headline);line-height:1.08;color:var(--color-text-on-accent);margin-top:var(--spacing-16)}
.footer{position:absolute;left:var(--spacing-64);right:var(--spacing-64);bottom:var(--spacing-40);
  display:flex;justify-content:space-between;font-size:var(--font-size-caption);
  font-weight:var(--font-weight-medium);color:var(--color-text-muted)}
</style></head><body>
<div class="board">
  <div class="kicker">PROBLEM &rarr; SOLUTION</div>
  <div class="spacer"></div>
  <div class="block prob">
    <div class="lab">The problem</div>
    <div class="txt">Hand-tweaked slides drift off-brand by slide three.</div>
  </div>
  <div class="arrow">&#9660;</div>
  <div class="block sol">
    <div class="lab">The fix</div>
    <div class="txt">Every value is a token. Drift is impossible.</div>
  </div>
  <div class="spacer"></div>
  <div class="footer"><span>@yourhandle · Your tagline here</span><span>PROBLEM SOLUTION</span></div>
</div>
</body></html>
