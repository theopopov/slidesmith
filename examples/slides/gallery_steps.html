<!doctype html><html><head><meta charset="utf-8"><style>
/*@BRAND_CSS@*/
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:var(--font-family-body)}
.board{width:1080px;height:1350px;position:relative;background:var(--color-bg-page);
  padding:var(--spacing-64);display:flex;flex-direction:column}
.kicker{font-size:var(--font-size-kicker);font-weight:var(--font-weight-bold);letter-spacing:.08em;
  text-transform:uppercase;color:var(--color-bg-accent)}
.h{font-family:var(--font-family-heading);font-weight:var(--font-weight-bold);
  font-size:var(--font-size-headline);line-height:1.04;margin-top:var(--spacing-24);color:var(--color-text-default)}
.spacer{flex:1}
.steps{display:flex;flex-direction:column;gap:var(--spacing-32)}
.step{display:flex;align-items:center;gap:var(--spacing-32)}
.num{flex:none;width:84px;height:84px;border-radius:var(--radius-pill);
  background:var(--color-bg-dark);color:var(--color-text-on-dark);
  font-family:var(--font-family-heading);font-weight:var(--font-weight-black);
  font-size:var(--font-size-subhead);display:flex;align-items:center;justify-content:center}
.step.key .num{background:var(--color-bg-accent);color:var(--color-text-on-accent)}
.txt{font-size:var(--font-size-subhead);font-weight:var(--font-weight-semibold);color:var(--color-text-default)}
.footer{position:absolute;left:var(--spacing-64);right:var(--spacing-64);bottom:var(--spacing-40);
  display:flex;justify-content:space-between;font-size:var(--font-size-caption);
  font-weight:var(--font-weight-medium);color:var(--color-text-muted)}
</style></head><body>
<div class="board">
  <div class="kicker">STEPS</div>
  <div class="h">From clone to PNG.</div>
  <div class="spacer"></div>
  <div class="steps">
    <div class="step"><span class="num">1</span><span class="txt">Set CHROME_BIN</span></div>
    <div class="step"><span class="num">2</span><span class="txt">Compile tokens to brand.css</span></div>
    <div class="step key"><span class="num">3</span><span class="txt">Author or template a slide</span></div>
    <div class="step"><span class="num">4</span><span class="txt">Render to PNG</span></div>
  </div>
  <div class="spacer"></div>
  <div class="footer"><span>@yourhandle · Your tagline here</span><span>STEPS</span></div>
</div>
</body></html>
